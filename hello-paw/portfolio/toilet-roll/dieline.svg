<svg xmlns="http://www.w3.org/2000/svg" width="391.9mm" height="183mm" viewBox="0 0 391.9 183"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="12" font-size="5.3" fill="#23313b" text-anchor="start">HELLO PAW / 卷纸腰封 · 结构参考展开图</text><text x="25" y="20" font-size="3.1" fill="#b32c3e" text-anchor="start">参考尺寸 v1｜单位 mm｜非维达官方刀模｜未经工厂验证，禁止直接生产</text><text x="25" y="27" font-size="3.2" fill="#23313b" text-anchor="start">暂定卷径 Ø105 × 高 100；腰封高 80；搭接 12</text><rect x="22" y="37" width="347.9" height="86" fill="#fffaf6" stroke="#b06cc6" stroke-width="0.3" stroke-dasharray="2 1"/><rect x="25" y="40" width="341.9" height="80" fill="#fffdf7" stroke="none" stroke-width="0.3" /><rect x="25" y="40" width="164.95" height="80" fill="#d3941415" stroke="none" stroke-width="0.3" /><rect x="189.95" y="40" width="164.95" height="80" fill="#f8f2e4" stroke="none" stroke-width="0.3" /><rect x="354.9" y="40" width="12" height="80" fill="#d7dce0" stroke="none" stroke-width="0.3" /><line x1="189.95" y1="40" x2="189.95" y2="120" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><line x1="354.9" y1="40" x2="354.9" y2="120" stroke="#777" stroke-width="0.3" stroke-dasharray="2 1"/><text x="107.475" y="70" font-size="6" fill="#d39414" text-anchor="middle">正面印刷区</text><text x="107.475" y="80" font-size="3.6" fill="#d39414" text-anchor="middle">小熊 LOGO / 黄色口号</text><text x="272.42499999999995" y="70" font-size="6" fill="#d39414" text-anchor="middle">背面信息区</text><text x="272.42499999999995" y="80" font-size="3.6" fill="#d39414" text-anchor="middle">信息栏 / 条码及二维码预留</text><text x="360.9" y="55" font-size="3" fill="#555" text-anchor="middle">搭接</text><text x="360.9" y="61" font-size="3" fill="#555" text-anchor="middle">12</text><text x="25" y="138" font-size="3" fill="#23313b" text-anchor="start">计算：π × 105 + 12 ≈ 341.9；此图仅为腰封，不含上下透明包膜。</text><rect x="25" y="40" width="341.9" height="80" fill="none" stroke="#d12d70" stroke-width="0.3" /><line x1="25" y1="33" x2="366.9" y2="33" stroke="#263640" stroke-width="0.3" /><line x1="25" y1="31" x2="25" y2="35" stroke="#263640" stroke-width="0.3" /><line x1="366.9" y1="31" x2="366.9" y2="35" stroke="#263640" stroke-width="0.3" /><text x="195.95" y="31" font-size="3.4" fill="#23313b" text-anchor="middle">341.9 mm</text><line x1="374.9" y1="40" x2="374.9" y2="120" stroke="#263640" stroke-width="0.3" /><text x="376.9" y="80" font-size="3.2" fill="#23313b" text-anchor="start">80</text><text x="25" y="129" font-size="2.8" fill="#23313b" text-anchor="start">外框 = 裁切参考；紫虚线 = 3 mm 出血参考；青虚线 = 面分界；灰色 = 封合禁放字区</text><text x="25" y="153" font-size="2.8" fill="#23313b" text-anchor="start">绿色虚线 = 5 mm 文字安全区；橙线 = 开口/贴标定位参考。所有工艺余量均为暂定。</text><text x="25" y="160" font-size="2.9" fill="#b32c3e" text-anchor="start">本图为结构及贴版区域模板，未包含最终印刷图稿；条码、文案、白墨版另行确认。</text><line x1="25" y1="169" x2="125" y2="169" stroke="#222" stroke-width="0.3" /><line x1="25" y1="167" x2="25" y2="171" stroke="#222" stroke-width="0.3" /><line x1="125" y1="167" x2="125" y2="171" stroke="#222" stroke-width="0.3" /><text x="130" y="170" font-size="2.8" fill="#23313b" text-anchor="start">100 mm 校准尺 · 输出请用 100% 比例</text></g></svg>