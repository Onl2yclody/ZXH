<svg xmlns="http://www.w3.org/2000/svg" width="319mm" height="408mm" viewBox="0 0 319 408"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,Arial,sans-serif"><text x="25" y="12" font-size="5.3" fill="#23313b" text-anchor="start">HELLO PAW / 湿纸巾 · 结构参考展开图</text><text x="25" y="20" font-size="3.1" fill="#b32c3e" text-anchor="start">参考尺寸 v1｜单位 mm｜非维达官方刀模｜未经工厂验证，禁止直接生产</text><text x="25" y="27" font-size="3.2" fill="#23313b" text-anchor="start">暂定成品 200 × 100 × 45；端封 12/12；纵封 15</text><rect x="22" y="37" width="275" height="311" fill="#fffaf6" stroke="#b06cc6" stroke-width="0.3" stroke-dasharray="2 1"/><rect x="25" y="40" width="269" height="305" fill="#fffdf7" stroke="none" stroke-width="0.3" /><rect x="25" y="40" width="12" height="305" fill="#e0e4e7" stroke="none" stroke-width="0.3" /><rect x="282" y="40" width="12" height="305" fill="#e0e4e7" stroke="none" stroke-width="0.3" /><rect x="37" y="40" width="22.5" height="305" fill="#edf2f5" stroke="none" stroke-width="0.3" /><rect x="259.5" y="40" width="22.5" height="305" fill="#edf2f5" stroke="none" stroke-width="0.3" /><line x1="59.5" y1="40" x2="59.5" y2="345" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><line x1="259.5" y1="40" x2="259.5" y2="345" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><rect x="59.5" y="40" width="200" height="50" fill="#faf6ed" stroke="none" stroke-width="0.3" /><text x="159.5" y="66" font-size="3.3" fill="#53616b" text-anchor="middle">背面上半  200 × 50</text><rect x="59.5" y="90" width="200" height="45" fill="#faf6ed" stroke="none" stroke-width="0.3" /><line x1="25" y1="90" x2="294" y2="90" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><text x="159.5" y="113.5" font-size="3.3" fill="#53616b" text-anchor="middle">侧面 / 顶面  200 × 45</text><rect x="59.5" y="135" width="200" height="100" fill="#147bbe18" stroke="none" stroke-width="0.3" /><line x1="25" y1="135" x2="294" y2="135" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><text x="159.5" y="186" font-size="5" fill="#147bbe" text-anchor="middle">正面主展示区  200 × 100</text><rect x="59.5" y="235" width="200" height="45" fill="#faf6ed" stroke="none" stroke-width="0.3" /><line x1="25" y1="235" x2="294" y2="235" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><text x="159.5" y="258.5" font-size="3.3" fill="#53616b" text-anchor="middle">侧面 / 底面  200 × 45</text><rect x="59.5" y="280" width="200" height="50" fill="#faf6ed" stroke="none" stroke-width="0.3" /><line x1="25" y1="280" x2="294" y2="280" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><text x="159.5" y="306" font-size="3.3" fill="#53616b" text-anchor="middle">背面下半  200 × 50</text><rect x="59.5" y="330" width="200" height="15" fill="#d7dce0" stroke="none" stroke-width="0.3" /><line x1="25" y1="330" x2="294" y2="330" stroke="#179aaa" stroke-width="0.3" stroke-dasharray="2 1"/><text x="159.5" y="338.5" font-size="3.3" fill="#53616b" text-anchor="middle">纵向封合区  200 × 15</text><rect x="64.5" y="140" width="190" height="90" fill="none" stroke="#6aab55" stroke-width="0.3" stroke-dasharray="1 1"/><text x="31" y="50" font-size="3" fill="#555" text-anchor="middle">端封</text><text x="288" y="50" font-size="3" fill="#555" text-anchor="middle">端封</text><rect x="124.5" y="167.5" width="70" height="35" rx="17.5" fill="white" stroke="#e59425" stroke-width="0.4" stroke-dasharray="1.5 1"/><text x="159.5" y="186" font-size="2.8" fill="#9a631a" text-anchor="middle">70 × 35 开口参考</text><rect x="109.5" y="152.5" width="100" height="65" rx="20" fill="none" stroke="#e59425" stroke-width="0.3"/><text x="159.5" y="149.5" font-size="2.8" fill="#9a631a" text-anchor="middle">复贴标 100 × 65（另件）</text><text x="25" y="363" font-size="3" fill="#23313b" text-anchor="start">膜片：269 × 305；端部折入余量各 22.5（暂定）；软包折线仅表示面分界。</text><text x="25" y="369" font-size="3" fill="#23313b" text-anchor="start">此结构采用纵封枕包概念；实际膜宽、节距及开口需按装袋机、材料和实物修正。</text><rect x="25" y="40" width="269" height="305" fill="none" stroke="#d12d70" stroke-width="0.3" /><line x1="25" y1="33" x2="294" y2="33" stroke="#263640" stroke-width="0.3" /><line x1="25" y1="31" x2="25" y2="35" stroke="#263640" stroke-width="0.3" /><line x1="294" y1="31" x2="294" y2="35" stroke="#263640" stroke-width="0.3" /><text x="159.5" y="31" font-size="3.4" fill="#23313b" text-anchor="middle">269 mm</text><line x1="302" y1="40" x2="302" y2="345" stroke="#263640" stroke-width="0.3" /><text x="304" y="192.5" font-size="3.2" fill="#23313b" text-anchor="start">305</text><text x="25" y="354" font-size="2.8" fill="#23313b" text-anchor="start">外框 = 裁切参考；紫虚线 = 3 mm 出血参考；青虚线 = 面分界；灰色 = 封合禁放字区</text><text x="25" y="378" font-size="2.8" fill="#23313b" text-anchor="start">绿色虚线 = 5 mm 文字安全区；橙线 = 开口/贴标定位参考。所有工艺余量均为暂定。</text><text x="25" y="385" font-size="2.9" fill="#b32c3e" text-anchor="start">本图为结构及贴版区域模板，未包含最终印刷图稿；条码、文案、白墨版另行确认。</text><line x1="25" y1="394" x2="125" y2="394" stroke="#222" stroke-width="0.3" /><line x1="25" y1="392" x2="25" y2="396" stroke="#222" stroke-width="0.3" /><line x1="125" y1="392" x2="125" y2="396" stroke="#222" stroke-width="0.3" /><text x="130" y="395" font-size="2.8" fill="#23313b" text-anchor="start">100 mm 校准尺 · 输出请用 100% 比例</text></g></svg>